name: Build AbyssRunner EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\src\AbyssRunner\AbyssRunner.csproj

      - name: Publish Windows x64
        shell: pwsh
        run: >
          dotnet publish .\src\AbyssRunner\AbyssRunner.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\dist

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AbyssRunner-win-x64
          path: dist/**
          if-no-files-found: error
